name: Release

on:
  push:
    tags: ["v*"]

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"

jobs:
  # Linux only (Omarchy/Arch first; any distro with an AppImage runtime).
  # tauri-action creates the GitHub release, builds the AppImage + .sig and
  # writes latest.json for the in-app updater. The AppImage is the
  # self-contained, directly runnable binary.
  release-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.96.0

      - uses: mozilla-actions/sccache-action@v0.0.10

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: release

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libsoup-3.0-dev \
            libdbus-1-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          CARGO_PROFILE_RELEASE_DEBUG: "0"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: WattDrive ${{ github.ref_name }}
          releaseBody: Automated build of WattDrive ${{ github.ref_name }}.
          releaseDraft: false
          prerelease: false
          args: --bundles appimage

      # Single-writer checksum step over every published asset.
      - name: Upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets --repo "$GITHUB_REPOSITORY" --pattern '*' --clobber
          rm -f release-assets/SHA256SUMS.txt
          ( cd release-assets && sha256sum $(ls -1 | sort) > ../SHA256SUMS.txt )
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

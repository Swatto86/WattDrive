name: Release

on:
  push:
    tags: ["v*"]

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"

jobs:
  # Serial writers let tauri-action merge both platforms into latest.json.
  release:
    strategy:
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.96.0

      - uses: mozilla-actions/sccache-action@v0.0.10

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: release

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libsoup-3.0-dev \
            libdbus-1-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          CARGO_PROFILE_RELEASE_DEBUG: "0"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: WattDrive ${{ github.ref_name }}
          releaseBody: |
            Two-way iCloud Drive sync for Windows and Linux.

            - Faster folder listing with eight concurrent batches and visible folder/item counts.
            - Up to four parallel file transfers, with serialized iCloud file-record changes to prevent overlapping-write errors.
            - Bounded retries for explicit iCloud busy responses reuse the uploaded content. Interrupted passes save completed work and wait before retrying.
            - Sync messages open in a separate dialog, including failures reported during an active sync. Signed service URLs are hidden from error messages.
            - Windows and Linux automated checks, local HTTP transfer/error tests, and real-window UI tests passed.
            - npm audit reports zero vulnerabilities, including development tools. Four Linux maintenance notices remain visible: RUSTSEC-2024-0370 and RUSTSEC-2026-0370/0371/0372. They are not security vulnerabilities and have no compatible published fix; recheck by 2026-11-10.

            Windows 10/11 x64 requires the [Evergreen WebView2 Runtime](https://developer.microsoft.com/en-us/microsoft-edge/webview2/). Linux x86_64 requires FUSE 2 (or --appimage-extract-and-run), a desktop session and an unlocked Secret Service keyring. See the README for installation and sign-in. Apple Passwords is not included.
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

      - name: Upload portable Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $name = "WattDrive_${version}_x64_portable.exe"
          Copy-Item target/release/wattdrive-desktop.exe $name
          gh release upload $env:GITHUB_REF_NAME $name --clobber --repo $env:GITHUB_REPOSITORY

  checksums:
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:

      # Single-writer checksum step over every published asset.
      - name: Upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets --repo "$GITHUB_REPOSITORY" --pattern '*' --clobber
          rm -f release-assets/SHA256SUMS.txt
          ( cd release-assets && sha256sum $(ls -1 | sort) > ../SHA256SUMS.txt )
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest --repo "$GITHUB_REPOSITORY"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Pinned to match rust-toolchain.toml so CI and local never drift.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - uses: mozilla-actions/sccache-action@v0.0.10

      - uses: Swatinem/rust-cache@v2

      # Tauri's Linux build needs the system webkit/gtk/appindicator libraries;
      # the keyring backend needs libdbus.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libsoup-3.0-dev \
            libdbus-1-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      # Produces dist/, which the Tauri crate's generate_context! embeds (needed
      # before clippy compiles the presentation crate).
      - name: Build frontend
        run: npm run build

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --all-targets

      # Debug compile of the real app — not installer packaging. Packaging,
      # signing, and updater artifacts belong to the tag-driven release.yml.
      - name: Tauri debug build
        run: npx tauri build --debug --no-bundle

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"

jobs:
  dependencies:
    runs-on: ubuntu-22.04
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Rust advisories and licences
        run: cargo deny --locked check --warn unmaintained advisories licenses
      - run: npm ci
      - name: npm advisories including development tooling
        run: npm audit
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Pinned to match rust-toolchain.toml so CI and local never drift.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - uses: mozilla-actions/sccache-action@v0.0.10

      - uses: Swatinem/rust-cache@v2

      # Tauri's Linux build needs the system webkit/gtk/appindicator libraries;
      # the keyring backend needs libdbus.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libsoup-3.0-dev \
            libdbus-1-dev \
            patchelf webkit2gtk-driver xvfb

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - name: Install prebuilt test driver
        run: cargo binstall --no-confirm --disable-strategies compile tauri-driver@2.0.6
      - name: Install matching Edge driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application" -Directory | Where-Object Name -Match '^\d+\.' | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $runtime) { throw 'WebView2 runtime not found' }
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$($runtime.Name)/edgedriver_win64.zip" -OutFile "$env:RUNNER_TEMP/driver.zip"
          Expand-Archive "$env:RUNNER_TEMP/driver.zip" "$env:RUNNER_TEMP/edge-driver"
          "EDGEDRIVER=$env:RUNNER_TEMP/edge-driver/msedgedriver.exe" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        run: npm ci

      # Produces dist/, which the Tauri crate's generate_context! embeds (needed
      # before clippy compiles the presentation crate).
      - name: Build frontend
        run: npm run build

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --all-targets

      # Debug compile of the real app — not installer packaging. Packaging,
      # signing, and updater artifacts belong to the tag-driven release.yml.
      - name: Tauri debug build
        run: npx tauri build --debug --no-bundle
      - name: WebDriver Windows
        if: runner.os == 'Windows'
        run: node scripts/e2e.mjs
      - name: WebDriver Linux
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a node scripts/e2e.mjs
